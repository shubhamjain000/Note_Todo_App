{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes & To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light shadow-sm fixed-top" style="background: #ffffff;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">Notes & To-Do</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse ms-auto" id="navbarNav">
            <div class="ms-auto d-flex flex-wrap gap-2">
                <a class="btn btn-outline-primary" href="{% url 'note_list' %}">Notes</a>
                <a class="btn btn-outline-info" href="{% url 'todo_list' %}">To-Do</a>
            </div>
        </div>
    </div>
</nav>

<div class="container" style="padding-top: 100px;">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
